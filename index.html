<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">

<title>GNU English Practice</title>

<style>

:root{

--gnu-blue:#004c97;
--gnu-gold:#a78b45;

}

body{

font-family:Pretendard,Arial;
background:#f0f2f5;
display:flex;
justify-content:center;
padding:20px;

}

.app{

background:white;
max-width:650px;
width:100%;
border-radius:20px;
padding:25px;
text-align:center;
border-top:8px solid var(--gnu-blue);

}

textarea{

width:100%;
height:100px;
font-size:16px;
margin-top:10px;

}

button{

width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;

}

.ai{

background:var(--gnu-blue);
color:white;

}

.record{

background:#ef4444;
color:white;

}

.speak{

background:#10b981;
color:white;

}

.box{

background:#f8fafc;
padding:15px;
border-radius:10px;
margin-top:15px;
text-align:left;

}

.score{

width:100px;
height:100px;
border-radius:50%;
border:5px solid var(--gnu-gold);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
margin:15px auto;

}

img{

width:140px;

}

</style>

</head>


<body>


<div class="app">

<img src="jinu.png">

<h2>GNU English Practice</h2>



<section>

<h3>Step1 문장 교정</h3>

<textarea id="userInput"></textarea>

<button class="ai" onclick="refineWithAI()">

AI 문장 교정

</button>

<div id="loading">

AI 처리중...

</div>

<div id="refinedResult" class="box">

문장을 입력하세요.

</div>

<button class="speak"

onclick="listenNative()">

🔊 원어민 듣기

</button>

</section>



<section id="step2"

style="display:none">

<h3>Step2 말하기 평가</h3>

<button class="record"

onclick="startRecording()"

id="recordBtn">

🎤 발음 시작

</button>


<div id="evaluation"

style="display:none">

<div class="score">

<span id="scoreValue">

0.0

</span>

</div>


<div id="feedback"

class="box">

</div>

</div>

</section>



</div>



<script>


// ⭐ Worker 주소

const WORKER_URL=

"https://hidden-shadow-6ff4.joyluck0505.workers.dev";


let refinedText="";

const synth=window.speechSynthesis;



async function refineWithAI(){

const input=

userInput.value;

if(!input){

alert("문장 입력");

return;

}

loading.style.display="block";

try{

const r=

await fetch(

WORKER_URL,

{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

contents:[{

parts:[{

text:

"영어 문장을 자연스럽게 교정하세요:\n"+input

}]

}]

})

}

);


const data=

await r.json();

console.log(data);

refinedText=

data.candidates[0]
.content.parts[0]
.text;

refinedResult.innerText=

refinedText;

step2.style.display="block";


}catch(e){

alert("AI 연결 실패");

console.log(e);

}

loading.style.display="none";

}



function listenNative(){

if(!refinedText)return;

synth.cancel();

const u=

new SpeechSynthesisUtterance(

refinedText

);

u.lang="en-US";

u.rate=0.85;

synth.speak(u);

}



// 말하기 평가

const SpeechRecognition=

window.SpeechRecognition||

window.webkitSpeechRecognition;

const recognition=

SpeechRecognition?

new SpeechRecognition():null;



if(recognition){

recognition.lang="en-US";

recognition.onresult=(e)=>{

const t=

e.results[0][0].transcript;

const c=

e.results[0][0].confidence;

evaluation.style.display="block";

scoreValue.innerText=

(c*5).toFixed(1);

feedback.innerText=

"인식:\n"+t;

recordBtn.innerText=

"다시 말하기";

};

}



function startRecording(){

if(!recognition){

alert("브라우저 미지원");

return;

}

recognition.start();

recordBtn.innerText=

"듣는중...";

}



</script>

</body>
</html>
