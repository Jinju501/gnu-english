<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>GNU English Practice - Gemini AI</title>

<style>
:root { --gnu-blue:#004c97; --gnu-gold:#a78b45; }

body{
font-family:sans-serif;
background:#f0f2f5;
display:flex;
justify-content:center;
padding:20px;
}

.app-card{
background:white;
max-width:600px;
width:100%;
padding:30px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.1);
border-top:8px solid var(--gnu-blue);
text-align:center;
}

textarea{
width:100%;
height:90px;
margin-bottom:10px;
}

button{
width:100%;
padding:12px;
margin-top:8px;
cursor:pointer;
}

.result-box{
min-height:60px;
padding:12px;
border:1px dashed var(--gnu-blue);
}

</style>
</head>

<body>

<div class="app-card">

<h2>GNU English Practice</h2>

<textarea id="userInput"
placeholder="문장을 입력하세요"></textarea>

<button id="refineBtn"
onclick="refineWithAI()">

AI 문장 교정 실행

</button>

<div id="loading" style="display:none;">
AI 처리중...
</div>

<div id="refinedResult"
class="result-box">

결과가 여기 표시됩니다.

</div>

</div>

<script>

/*
⚠️ 여기만 직접 본인이 입력하세요.
절대 GitHub public repo에 그대로 올리지 마세요.
*/

const API_KEY="AIzaSyDz9rPTpRuTsPVaQi08VQ0PeGN-G-b_jlI";

async function refineWithAI(){

const input=document.getElementById("userInput").value;

if(!input){

alert("문장을 입력하세요");

return;
}

const btn=document.getElementById("refineBtn");
const loading=document.getElementById("loading");

btn.disabled=true;
loading.style.display="block";

try{

const url=
`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

const response=await fetch(url,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

contents:[{

parts:[{

text:
`Refine into natural academic English only:

"${input}"`

}]

}]

})

});


/* ⭐ 가장 중요 — HTTP 오류 확인 */

if(!response.ok){

const errorText=
await response.text();

console.error(
"HTTP ERROR:",
errorText
);

throw new Error("HTTP FAIL");

}


const data=await response.json();

console.log("Gemini RAW:",data);


/* ⭐ 안전한 응답 파싱 */

const refined=
data?.candidates?.[0]
?.content?.parts?.[0]
?.text;

if(!refined){

throw new Error(
"응답 구조 오류"
);

}

document
.getElementById("refinedResult")
.innerText=refined.trim();

}catch(e){

console.error("AI ERROR:",e);

alert(
"AI 연결 실패 — Console(F12)을 확인하세요."
);

}

finally{

btn.disabled=false;

loading.style.display="none";

}

}

</script>

</body>
</html>
