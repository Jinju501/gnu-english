<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<title>GNU English AI Practice</title>

<style>

body{
font-family:Arial;
text-align:center;
padding:40px;
background:#f5f7fa;
}

button{
padding:12px 20px;
margin:10px;
font-size:18px;
cursor:pointer;
}

textarea{

width:80%;
height:120px;
font-size:16px;

}

#result{

margin-top:20px;
padding:20px;
background:white;
border-radius:10px;
min-height:80px;

}

</style>

</head>


<body>

<h2>GNU English AI Practice</h2>


<!-- STEP1 -->

<div id="step1">

<button onclick="goStep2()">

🎤 Step2 말하기 평가 시작

</button>

</div>


<!-- STEP2 -->

<div id="step2" style="display:none;">

<h3>영어 문장을 입력하세요</h3>

<textarea id="studentText"></textarea>

<br>

<button onclick="refineWithAI()">

AI 평가 받기

</button>

<button onclick="backHome()">

처음으로

</button>

<div id="result">

AI 결과가 여기 표시됩니다.

</div>

</div>


<script>


// ⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐
// 반드시 본인 Worker 주소
// ⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐

const WORKER_URL =
"https://hidden-shadow-6ff4.joyluck0505.workers.dev";



// STEP 이동

function goStep2(){

document.getElementById("step1")
.style.display="none";

document.getElementById("step2")
.style.display="block";

}


function backHome(){

document.getElementById("step2")
.style.display="none";

document.getElementById("step1")
.style.display="block";

}



// ⭐⭐⭐ Gemini AI 평가 ⭐⭐⭐

async function refineWithAI(){

const input =
document.getElementById("studentText").value;

if(!input){

alert("문장을 입력하세요.");

return;

}

try{

const response =
await fetch(

WORKER_URL,

{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

contents:[

{

parts:[

{

text:

"학생 영어 발화를 평가하고 자연스럽게 교정해 주세요:\n\n"
+ input

}

]

}

]

})

}

);



const data = await response.json();

console.log("AI RESPONSE =",data);


// ⭐⭐⭐ 최신 Gemini 안전 파싱 ⭐⭐⭐

let result="AI 응답 없음";

if(

data &&
data.candidates &&
data.candidates.length>0 &&
data.candidates[0].content &&
data.candidates[0].content.parts &&
data.candidates[0].content.parts.length>0

){

result =
data.candidates[0]
.content.parts[0]
.text;

}


document.getElementById("result")
.innerText=result;

}catch(e){

console.log(e);

alert("AI 연결 실패");

}

}

</script>

</body>

</html>
