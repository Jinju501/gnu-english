<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>GNU English Practice</title>

<style>

:root{
--gnu-blue:#004c97;
--gnu-gold:#a78b45;
}

body{
font-family:Pretendard,sans-serif;
background:#f0f2f5;
display:flex;
justify-content:center;
padding:20px;
}

.app-card{

background:white;
width:100%;
max-width:600px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
padding:30px;
border-top:8px solid var(--gnu-blue);
text-align:center;

}

h1{
color:var(--gnu-blue);
margin-bottom:5px;
}

.sub-title{

color:#666;
font-size:14px;
margin-bottom:25px;

}

section{

text-align:left;
margin-bottom:25px;
padding:18px;
border-radius:12px;
background:#f8fafc;
border:1px solid #e2e8f0;

}

textarea{

width:100%;
height:90px;
border-radius:10px;
padding:12px;
font-size:16px;
margin-bottom:10px;

}

button{

width:100%;
padding:14px;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
margin-top:5px;

}

.btn-ai{

background:var(--gnu-blue);
color:white;

}

.btn-speak{

background:#10b981;
color:white;

}

.btn-record{

background:#ef4444;
color:white;

}

.result-box{

font-size:18px;
font-weight:600;
padding:15px;
background:white;
border-radius:10px;
border:1px dashed var(--gnu-blue);
min-height:50px;

}

.score-circle{

width:100px;
height:100px;
border-radius:50%;
border:5px solid var(--gnu-gold);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
margin:20px auto;

}

.score-num{

font-size:32px;
font-weight:800;

}

.feedback{

font-size:14px;
white-space:pre-wrap;
background:#fffbe6;
padding:15px;
border-radius:10px;

}

#loading{

display:none;
text-align:center;

}

.jinu-img{

width:150px;
margin-bottom:15px;

}

</style>
</head>

<body>

<div class="app-card">

<img src="jinu.png" class="jinu-img">

<h1>GNU English Practice</h1>

<p class="sub-title">

Humanities-based English Speaking Lab

</p>


<section>

<h3>Step 1. 영작 및 교정</h3>

<textarea id="userInput"
placeholder="연습 문장을 입력하세요"></textarea>

<button class="btn-ai"
onclick="refineWithAI()">

AI 문장 교정

</button>

<div id="loading">

AI가 문장을 다듬는 중...

</div>

<div style="margin-top:20px">

<div class="result-box"
id="refinedResult">

문장을 입력하세요.

</div>

<button
class="btn-speak"
onclick="listenNative()">

🔊 원어민 발음 듣기

</button>

</div>

</section>


<section id="step2"
style="display:none;">

<h3>

Step 2. 말하기 평가

</h3>

<button
id="recordBtn"
class="btn-record"
onclick="startRecording()">

🎤 발음 시작

</button>

<div
id="evaluationArea"
style="display:none;">

<div class="score-circle">

<span>SCORE</span>

<span
class="score-num"
id="scoreValue">

0.0

</span>

</div>

<div
class="feedback"
id="feedbackDetail">

</div>

</div>

</section>

</div>


<script>

// ⭐⭐⭐⭐⭐
// 여기에 Worker 주소 넣기
// ⭐⭐⭐⭐⭐

const WORKER_URL=

"https://hidden-shadow-6ff4.joyluck0505.workers.dev";


let refinedText="";

const synth=window.speechSynthesis;



async function refineWithAI(){

const input=
document.getElementById("userInput").value;

if(!input){

alert("문장을 입력하세요.");

return;

}

document.getElementById(
"loading"
).style.display="block";

try{

const res=await fetch(

WORKER_URL,

{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

contents:[{

parts:[{

text:

`Refine into natural academic English:

"${input}"

Return ONLY the refined sentence.`

}]

}]

})

}

);

const data=
await res.json();

refinedText=

data.candidates[0]
.content.parts[0]
.text.trim();

document.getElementById(
"refinedResult"
).innerText=

refinedText;

document.getElementById(
"step2"
).style.display="block";

}catch(e){

alert("AI 연결 실패");

console.error(e);

}

document.getElementById(
"loading"
).style.display="none";

}



function listenNative(){

if(!refinedText)return;

synth.cancel();

const u=
new SpeechSynthesisUtterance(
refinedText
);

u.lang="en-US";

u.rate=0.9;

synth.speak(u);

}



const SpeechRecognition=

window.SpeechRecognition||
window.webkitSpeechRecognition;

const recognition=

SpeechRecognition
?new SpeechRecognition()
:null;

if(recognition){

recognition.lang="en-US";

recognition.onresult=

(e)=>{

const result=
e.results[0][0];

document.getElementById(
"evaluationArea"
).style.display="block";

document.getElementById(
"scoreValue"
).innerText=

(result.confidence*5)
.toFixed(1);

document.getElementById(
"feedbackDetail"
).innerText=

`[인식 결과]

"${result.transcript}"

반복 연습하세요!`;

document.getElementById(
"recordBtn"
).innerText=

"🎤 다시 말하기";

};

}



function startRecording(){

if(!recognition){

alert(
"브라우저 미지원"
);

return;

}

recognition.start();

document.getElementById(
"recordBtn"
).innerText=

"🔴 듣는 중...";

}

</script>

</body>
</html>
