<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>GNU English AI Studio</title>

<meta name="viewport" content="width=device-width,initial-scale=1">

<style>

/* ===== BASIC ===== */

body{

font-family:Arial, sans-serif;
background:#eef2f7;
max-width:1000px;
margin:auto;
padding:25px;

}

h1{

text-align:center;

}

/* ===== GNU ===== */

#ginu{

position:fixed;
bottom:20px;
right:20px;
font-size:45px;

}

/* ===== BOX ===== */

textarea{

width:100%;
height:180px;
padding:12px;
font-size:16px;

}

button{

padding:10px 14px;
margin:5px;
cursor:pointer;
font-size:15px;

}

.card{

background:white;
padding:15px;
border-radius:10px;
margin-top:15px;

box-shadow:0 2px 6px rgba(0,0,0,0.15);

}

.score{

font-weight:bold;
margin-top:10px;

}

</style>

</head>

<body>

<h1>GNU English AI Studio</h1>

<div class="card">

<h3>STEP1 — Draft Correction</h3>

<textarea id="input"
placeholder="Paste student writing..."></textarea>

<button onclick="runStep1()">

STEP1 Grammar Fix

</button>

</div>


<div class="card">

<h3>STEP2 — Academic Refinement</h3>

<button onclick="runStep2()">

STEP2 Academic Rewrite

</button>

</div>


<div class="card">

<h3>Result</h3>

<div id="output">

Result appears here.

</div>

<div id="score" class="score">

</div>

<button onclick="downloadDoc()">

Download Word (.doc)

</button>

<button onclick="speakText()">

Speaking Feedback 🔊

</button>

</div>


<div id="ginu">

🦊

</div>


<script>

/* ========= CHANGE THIS ========= */

const WORKER_URL=

"https://YOURWORKER.workers.dev";

/* =============================== */


let step1Text="";

let finalText="";

async function callAI(prompt){

const payload={

contents:[{

parts:[{text:prompt}]

}]

};

const res=await fetch(

WORKER_URL,

{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify(payload)

}

);

if(!res.ok){

throw Error("Worker Error");

}

const data=await res.json();

return data
.candidates?.[0]
?.content?.parts?.[0]?.text
||"No AI response.";

}


/* ===== STEP1 ===== */

async function runStep1(){

const input=

document.getElementById("input").value;

if(!input){

alert("Enter text");

return;

}

document.getElementById("output")
.innerText="STEP1 Working...";

const prompt=

`
Fix grammar only.

Do not rewrite style.

TEXT:

${input}

Return corrected text only.
`;

try{

step1Text=await callAI(prompt);

document.getElementById("output")
.innerText=step1Text;

}catch(e){

alert(e);

}

}


/* ===== STEP2 ===== */

async function runStep2(){

if(!step1Text){

alert("Run STEP1 first.");

return;

}

document.getElementById("output")
.innerText="STEP2 Working...";


const prompt=

`
You are an academic journal editor.

Rewrite academically.

Keep author's meaning.

Return:

REFINED TEXT:

then

EVALUATION SCORE (0-100)
with 1 sentence comment.

TEXT:

${step1Text}

`;

try{

const result=await callAI(prompt);

parseResult(result);

}catch(e){

alert(e);

}

}


function parseResult(text){

let refined=text;

let score="";

if(text.includes("REFINED TEXT")){

const split=text.split("REFINED TEXT:");

const rest=split[1];

const evalSplit=

rest.split("EVALUATION");

refined=evalSplit[0];

score=evalSplit[1]||"";

}

finalText=refined;

document.getElementById("output")
.innerText=refined;

document.getElementById("score")
.innerText=score;

}


/* ===== WORD DOWNLOAD ===== */

function downloadDoc(){

if(!finalText){

alert("No result.");

return;

}

const header=

"<html><body>";

const footer="</body></html>";

const blob=

new Blob(

[header+finalText+footer],

{type:"application/msword"}

);

const url=

URL.createObjectURL(blob);

const a=document.createElement("a");

a.href=url;

a.download="AI_Refined.doc";

a.click();

}


/* ===== SPEAK ===== */

function speakText(){

if(!finalText){

alert("No result.");

return;

}

speechSynthesis.cancel();

const utter=

new SpeechSynthesisUtterance(finalText);

utter.lang="en-US";

speechSynthesis.speak(utter);

}

</script>

</body>

</html>
