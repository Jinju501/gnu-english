<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<title>GNU English AI Lab</title>

<style>

body{

font-family:Arial;
background:#eef2f7;
text-align:center;
padding:30px;

}

h1{

margin-bottom:20px;

}

button{

padding:14px 22px;
margin:8px;
font-size:18px;
cursor:pointer;
border-radius:8px;
border:none;
background:#2b7cff;
color:white;

}

textarea{

width:85%;
height:130px;
font-size:16px;

}

#panel{

background:white;
padding:20px;
border-radius:12px;
margin-top:20px;

}

.avatar{

font-size:60px;

}

</style>

</head>


<body>

<h1>GNU English AI Practice</h1>


<div id="home">

<div class="avatar">

🧑‍🏫 지누

</div>

<button onclick="openSpeak()">

🎤 말하기 평가

</button>


<button onclick="openGrammar()">

✏️ 문장 교정

</button>

</div>



<div id="speak" style="display:none">

<h3>말하기 평가</h3>

<textarea id="speechText"></textarea>

<br>

<button onclick="evaluateSpeech()">

AI 평가

</button>

<button onclick="goHome()">

처음으로

</button>

<div id="speechResult" class="panel">

</div>

</div>



<div id="grammar" style="display:none">

<h3>문장 교정</h3>

<textarea id="grammarText"></textarea>

<br>

<button onclick="correctGrammar()">

AI 교정

</button>

<button onclick="goHome()">

처음으로

</button>

<div id="grammarResult">

</div>

</div>


<script>


const WORKER_URL=

"https://hidden-shadow-6ff4.joyluck0505.workers.dev";



function openSpeak(){

home.style.display="none";
speak.style.display="block";
grammar.style.display="none";

}


function openGrammar(){

home.style.display="none";
grammar.style.display="block";
speak.style.display="none";

}


function goHome(){

home.style.display="block";
grammar.style.display="none";
speak.style.display="none";

}



async function callAI(prompt){

const r = await fetch(

WORKER_URL,

{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

contents:[{

parts:[{

text:prompt

}]

}]

})

}

);

const data = await r.json();

console.log(data);

if(

data &&
data.candidates &&
data.candidates.length>0 &&
data.candidates[0].content &&
data.candidates[0].content.parts &&
data.candidates[0].content.parts.length>0

){

return data.candidates[0]
.content.parts[0]
.text;

}

return "AI 응답 없음";

}



// 말하기 평가

async function evaluateSpeech(){

const input =
speechText.value;

if(!input){

alert("문장을 입력하세요");

return;

}

speechResult.innerText="평가 중...";

const result = await callAI(

"학생 영어 발화를 평가하고 자연스럽게 교정하세요:\n\n"+input

);

speechResult.innerText=result;

}



// 문장 교정

async function correctGrammar(){

const input =
grammarText.value;

if(!input){

alert("문장을 입력하세요");

return;

}

grammarResult.innerText="교정 중...";

const result = await callAI(

"다음 영어 문장을 자연스럽게 교정하세요:\n\n"+input

);

grammarResult.innerText=result;

}


</script>


</body>

</html>
