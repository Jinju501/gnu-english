<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">

<title>GNU English Practice</title>

<style>

body{

font-family:Arial;
background:#f2f6fb;
text-align:center;
padding:30px;

}

.card{

background:white;
padding:25px;
border-radius:15px;
max-width:700px;
margin:auto;

}

textarea{

width:90%;
height:120px;
font-size:16px;

}

button{

padding:14px 22px;
margin:10px;
font-size:17px;
border:none;
border-radius:8px;
cursor:pointer;
background:#004c97;
color:white;

}

.result{

margin-top:20px;
padding:15px;
background:#f8fafc;
border-radius:10px;

}

img{

width:140px;

}

</style>

</head>

<body>

<div class="card">

<img src="jinu.png">

<h2>GNU English AI Lab</h2>


<div id="home">

<button onclick="openGrammar()">

✏️ 문장 교정

</button>

<button onclick="openSpeech()">

🎤 말하기 평가

</button>

</div>


<div id="grammar" style="display:none">

<h3>문장 교정</h3>

<textarea id="grammarInput"></textarea>

<br>

<button onclick="correctSentence()">

AI 교정

</button>

<button onclick="goHome()">

처음으로

</button>

<div id="grammarResult" class="result">

</div>

</div>



<div id="speech" style="display:none">

<h3>말하기 평가</h3>

<textarea id="speechInput"></textarea>

<br>

<button onclick="evaluateSpeech()">

AI 평가

</button>

<button onclick="goHome()">

처음으로

</button>

<div id="speechResult" class="result">

</div>

</div>


</div>


<script>

const WORKER_URL=

"https://hidden-shadow-6ff4.joyluck0505.workers.dev";



function openGrammar(){

home.style.display="none";

grammar.style.display="block";

speech.style.display="none";

}


function openSpeech(){

home.style.display="none";

speech.style.display="block";

grammar.style.display="none";

}


function goHome(){

home.style.display="block";

grammar.style.display="none";

speech.style.display="none";

}



async function callAI(prompt){

try{

const r=await fetch(

WORKER_URL,

{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

contents:[{

parts:[{

text:prompt

}]

}]

})

}

);

const data=await r.json();

console.log(data);

if(

data.candidates &&

data.candidates[0] &&

data.candidates[0].content &&

data.candidates[0].content.parts

){

return data.candidates[0]
.content.parts[0]
.text;

}

return "AI 응답 없음";

}catch(e){

console.log(e);

return "AI 연결 실패";

}

}



// 문장 교정

async function correctSentence(){

const input=

grammarInput.value;

if(!input){

alert("문장을 입력하세요");

return;

}

grammarResult.innerText="교정 중...";

const result=

await callAI(

"다음 문장을 자연스럽게 교정하세요:\n\n"+input

);

grammarResult.innerText=result;

}



// 말하기 평가

async function evaluateSpeech(){

const input=

speechInput.value;

if(!input){

alert("문장을 입력하세요");

return;

}

speechResult.innerText="평가 중...";

const result=

await callAI(

"학생 영어 발화를 평가하고 교정하세요:\n\n"+input

);

speechResult.innerText=result;

}

</script>

</body>
</html>
